name: CI

on:
  pull_request:
  push:
    branches: [main, dev]

jobs:
  pytest:
    runs-on: ubuntu-latest
    services:
      redis:   # for the stream integration tests (pipeline/tests/test_streams.py)
        image: redis:7.4-alpine
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 2s --health-timeout 2s --health-retries 15
    env:
      FW47_TEST_REDIS_URL: redis://localhost:6379/15
      FW47_REQUIRE_REDIS: "1"   # fail, don't skip, if Redis isn't there
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pip install -e "./pipeline[test]"
      - run: pytest pipeline

  npm-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm test
