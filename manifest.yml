modules:
  jira:issuePanel:
    - key: fw47-ui
      resource: main
      resolver:
        function: resolver
      render: native
      title: Race Incident
      viewportSize: medium
      icon: https://developer.atlassian.com/platform/forge/images/icons/issue-panel-icon.svg

  webtrigger:
    - key: race-radio-listener
      function: receive-radio-data

  function:
    - key: resolver
      handler: index.handler 
    - key: receive-radio-data
      handler: index.runRadioListener

resources:
  - key: main
    path: src/frontend/index.jsx
app:
  runtime:
    name: nodejs22.x
    memoryMB: 256
    architecture: arm64
  id: ari:cloud:ecosystem::app/aa8d3260-46fe-414b-93e8-439fb94c4203

permissions:
  scopes:
    - read:jira-work
    - write:jira-work
